<!-- 

**Oppgave 1. Enkel kalkulator**

Lag en kalkulator-app som lar brukeren skrive inn to tall og velge en matematisk operator (+, -, *, /). Når brukeren trykker på "Beregn"-knappen, skal resultatet vises.
- Modell: lagre tallene og operatoren.
- View: vis input-feltene, operatorvalg og resultat.
- Controller: håndtere beregningen når brukeren trykker på knappen.

*Elementer: MVC, this, funksjoner, parametre, if/else, return, variabler.* 

Min egen utfordring:
Neste steg: 
    > Lage ","-knapp
    > Konvertere "." til "," - brukte replaceAll()
    > Delete-knapp, som bare fjerner et tall
    > Legge til symboler. Symbolene skal vises på kalkulatoren, men på baksiden skal det bruke de vanlige operatørene.
        F.eks. "x" skal vises på kalkulatoren, men "*" skal brukes ved utregning. Eller "÷" og "/".
    
    > Bruke ⌫ for å slette et tall i en streng. Må kunne slette operatør og tallEnInput.
    > Sette 0-tallet etter 9
    > Når du har trykket på = og trykker på et nytt tall så skal regnstykket starte på nytt.
    > Når du trykker på en operatør etter =, så fortsetter den regnestykket etter resultatet er vist.

-->

    <div id="app"></div>
    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>

</body>
</html>
